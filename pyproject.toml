[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentramen"
version = "0.2.0"
description = "Local-first repository intelligence and task context for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "agentRamen contributors" }]
keywords = ["git", "code-intelligence", "repository-analysis", "coding-agents", "mcp"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"License :: OSI Approved :: Apache Software License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/palrajjp/agentRamen"
Repository = "https://github.com/palrajjp/agentRamen"
Issues = "https://github.com/palrajjp/agentRamen/issues"

[project.optional-dependencies]
treesitter = ["tree-sitter-language-pack>=1.21.0"]
semantic = ["fastembed>=0.9.0"]
tokenizer = ["tiktoken>=0.12.0"]
central = ["mcp>=2.3.0,<3", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
agentramen = "agentramen.cli:main"

[tool.setuptools.packages.find]
include = ["agentramen*"]

[tool.setuptools.package-data]
agentramen = ["assets/*.png"]
