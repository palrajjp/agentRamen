[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgraph"
version = "0.1.0"
description = "Local-first Git history and repository context for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "GitGraph contributors" }]
dependencies = []

[project.optional-dependencies]
treesitter = ["tree-sitter-language-pack>=1.21.0"]
semantic = ["fastembed>=0.9.0"]
tokenizer = ["tiktoken>=0.12.0"]

[project.scripts]
gitgraph = "gitgraph.cli:main"

[tool.setuptools.packages.find]
include = ["gitgraph*"]
