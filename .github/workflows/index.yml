name: agentRamen reusable index

on:
  workflow_call:
    inputs:
      task:
        description: Optional task to build bounded repository context for
        required: false
        type: string
      token_budget:
        description: Maximum context budget when task is supplied
        required: false
        type: number
        default: 2000
      central_snapshot:
        description: Export a sanitized snapshot for centralized MCP
        required: false
        type: boolean
        default: false
      repository_id:
        description: Stable repository identifier embedded in the snapshot
        required: false
        type: string
  workflow_dispatch:
    inputs:
      task:
        description: Optional task to build bounded repository context for
        required: false
        type: string
      token_budget:
        description: Maximum context budget when task is supplied
        required: false
        type: number
        default: 2000
      central_snapshot:
        description: Export a sanitized snapshot for centralized MCP
        required: false
        type: boolean
        default: false
      repository_id:
        description: Stable repository identifier embedded in the snapshot
        required: false
        type: string

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: palrajjp/agentRamen
          ref: main
          path: .agentramen-action
          token: ${{ github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .agentramen
          key: agentramen-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            agentramen-${{ runner.os }}-${{ github.ref }}-
            agentramen-${{ runner.os }}-
      - name: Build repository graph
        run: |
          python -m pip install ./.agentramen-action
          python -m unittest discover -s .agentramen-action/tests -v
          agentramen index --json
      - name: Export centralized MCP snapshot
        if: inputs.central_snapshot
        env:
          AGENTRAMEN_REPOSITORY_ID: ${{ inputs.repository_id }}
        run: agentramen snapshot export --repository-id "$AGENTRAMEN_REPOSITORY_ID" --output "$RUNNER_TEMP/agentramen-snapshot.zip" --json
      - name: Validate centralized MCP snapshot
        if: inputs.central_snapshot
        env:
          AGENTRAMEN_REPOSITORY_ID: ${{ inputs.repository_id }}
        run: agentramen snapshot verify --repository-id "$AGENTRAMEN_REPOSITORY_ID" --archive "$RUNNER_TEMP/agentramen-snapshot.zip" --json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload centralized MCP snapshot
        if: inputs.central_snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agentramen-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/agentramen-snapshot.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build task-specific context
        if: inputs.task != ''
        env:
          AGENTRAMEN_TASK: ${{ inputs.task }}
          AGENTRAMEN_TOKEN_BUDGET: ${{ inputs.token_budget }}
        run: agentramen context "$AGENTRAMEN_TASK" --budget "$AGENTRAMEN_TOKEN_BUDGET" --json > agentramen-context.json
      - name: Upload task context
        if: inputs.task != ''
        uses: actions/upload-artifact@v4
        with:
          name: agentramen-context-${{ github.sha }}
          path: agentramen-context.json
          if-no-files-found: error
          retention-days: 14
      - name: Summarize pull request context
        if: github.event_name == 'pull_request'
        run: agentramen pr --base "${{ github.event.pull_request.base.sha }}" --json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agentramen-${{ github.sha }}
          path: .agentramen/graph.db
          if-no-files-found: error
          retention-days: 14
